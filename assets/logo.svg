    <circle cx="20" cy="25" r="5" fill="url(#grad1)" />
    <circle cx="80" cy="25" r="5" fill="url(#grad1)" />
    <!-- Cross on top of King -->
    <path d="M48 2 L52 2 L52 8 L58 8 L58 12 L52 12 L52 18 L48 18 L48 12 L42 12 L42 8 L48 8 Z" fill="url(#grad1)" />
